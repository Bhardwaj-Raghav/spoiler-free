<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spoiler Free</title>
    <link rel="stylesheet" href="./assets/style/style.css?v=2.0.0" />
    <script src="./assets/scripts/script.js?v=2.0.0" defer></script>
  </head>

  <body class="popup-root light-theme">
    <div class="sf-shell">
      <header id="header" class="sf-topbar">
        <h1 class="sf-brand">Spoiler Free</h1>
        <div class="sf-topbar__actions">
          <button type="button" id="open-help" class="sf-text-btn">How it works</button>
          <span class="custom-toggle sf-theme-toggle" title="Theme">
            <input
              type="checkbox"
              class="toggle-hidden"
              id="theme-toggle"
              aria-label="Switch to dark theme"
            />
            <label class="toggle-label" for="theme-toggle">
              <svg
                fill="currentColor"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 384 512"
                id="dark-svg"
                aria-hidden="true"
              >
                <path
                  d="M223.5 32C100 32 0 132.3 0 256S100 480 223.5 480c60.6 0 115.5-24.2 155.8-63.4c5-4.9 6.3-12.5 3.1-18.7s-10.1-9.7-17-8.5c-9.8 1.7-19.8 2.6-30.1 2.6c-96.9 0-175.5-78.8-175.5-176c0-65.8 36-123.1 89.3-153.3c6.1-3.5 9.2-10.5 7.7-17.3s-7.3-11.9-14.3-12.5c-6.3-.5-12.6-.8-19-.8z"
                />
              </svg>
              <svg
                fill="currentColor"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 512 512"
                id="light-svg"
                aria-hidden="true"
              >
                <path
                  d="M361.5 1.2c5 2.1 8.6 6.6 9.6 11.9L391 121l107.9 19.8c5.3 1 9.8 4.6 11.9 9.6s1.5 10.7-1.6 15.2L446.9 256l62.3 90.3c3.1 4.5 3.7 10.2 1.6 15.2s-6.6 8.6-11.9 9.6L391 391 371.1 498.9c-1 5.3-4.6 9.8-9.6 11.9s-10.7 1.5-15.2-1.6L256 446.9l-90.3 62.3c-4.5 3.1-10.2 3.7-15.2 1.6s-8.6-6.6-9.6-11.9L121 391 13.1 371.1c-5.3-1-9.8-4.6-11.9-9.6s-1.5-10.7 1.6-15.2L65.1 256 2.8 165.7c-3.1-4.5-3.7-10.2-1.6-15.2s6.6-8.6 11.9-9.6L121 121 140.9 13.1c1-5.3 4.6-9.8 9.6-11.9s10.7-1.5 15.2 1.6L256 65.1 346.3 2.8c4.5-3.1 10.2-3.7 15.2-1.6zM160 256a96 96 0 1 1 192 0 96 96 0 1 1 -192 0zm224 0a128 128 0 1 0 -256 0 128 128 0 1 0 256 0z"
                />
              </svg>
            </label>
          </span>
        </div>
      </header>

      <p id="footer" class="sf-metrics" aria-label="Summary">
        <span><span id="total-blocked-videos">0</span> shielded</span>
        <span class="sf-metrics__sep" aria-hidden="true">·</span>
        <span><span id="total-keywords-added">0</span> phrases</span>
      </p>

      <main id="main" class="sf-main">
        <section class="sf-card sf-card--keywords" aria-labelledby="card-keywords-title">
          <h2 id="card-keywords-title" class="sf-sr-only">Keywords</h2>
          <div class="sf-keyword-toolbar">
            <form method="post" id="add-keyword-form" class="sf-inline-form sf-inline-form--grow">
              <label class="sf-sr-only" for="keyword-input">Keyword or phrase</label>
              <input
                type="text"
                name="keyword"
                id="keyword-input"
                autocomplete="off"
                placeholder="Phrase…"
                required
                aria-describedby="keyword-form-feedback"
              />
              <button type="submit" class="sf-btn sf-btn--primary sf-btn--compact">Add</button>
            </form>
            <button
              type="button"
              id="open-keywords-list"
              class="sf-btn sf-btn--icon"
              aria-label="Edit saved phrases"
              title="Edit list"
            >
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                <line x1="8" y1="6" x2="21" y2="6" />
                <line x1="8" y1="12" x2="21" y2="12" />
                <line x1="8" y1="18" x2="21" y2="18" />
                <line x1="3" y1="6" x2="3.01" y2="6" />
                <line x1="3" y1="12" x2="3.01" y2="12" />
                <line x1="3" y1="18" x2="3.01" y2="18" />
              </svg>
            </button>
          </div>
          <p id="keyword-form-feedback" class="sf-feedback sf-feedback--inline" role="status" aria-live="polite"></p>
        </section>

        <section class="sf-card" aria-labelledby="card-match-title">
          <h2 id="card-match-title" class="sf-section-label">Match</h2>
          <div class="sf-segment sf-match-toggle" role="group" aria-labelledby="card-match-title">
            <span class="sf-segment__label sf-segment__label--left sf-match-toggle__label sf-match-toggle__label--left"
              >Remove</span
            >
            <span class="custom-toggle radio-option sf-segment__toggle">
              <input
                type="checkbox"
                value="block"
                class="toggle-hidden"
                id="block-content-toggle"
                aria-label="Block with cover instead of removing the row"
              />
              <label class="toggle-label" for="block-content-toggle"></label>
            </span>
            <span class="sf-segment__label sf-segment__label--right sf-match-toggle__label sf-match-toggle__label--right"
              >Block</span
            >
          </div>
        </section>

        <section class="sf-card" aria-labelledby="card-scopes-title">
          <h2 id="card-scopes-title" class="sf-section-label">Scan</h2>
          <div class="setting-options sf-scope-list">
            <div class="setting-option sf-scope-row">
              <span class="sf-scope-row__label">Home</span>
              <span class="custom-toggle">
                <input
                  type="checkbox"
                  checked
                  value="title"
                  class="settings-toggle toggle-hidden"
                  id="title-toggle"
                />
                <label class="toggle-label" for="title-toggle"></label>
              </span>
            </div>
            <div class="setting-option sf-scope-row">
              <span class="sf-scope-row__label">Search</span>
              <span class="custom-toggle">
                <input
                  type="checkbox"
                  checked
                  value="search"
                  class="settings-toggle toggle-hidden"
                  id="search-toggle"
                />
                <label class="toggle-label" for="search-toggle"></label>
              </span>
            </div>
            <div class="setting-option sf-scope-row">
              <span class="sf-scope-row__label">Watch</span>
              <span class="custom-toggle">
                <input
                  type="checkbox"
                  checked
                  value="watch"
                  class="settings-toggle toggle-hidden"
                  id="watch-toggle"
                />
                <label class="toggle-label" for="watch-toggle"></label>
              </span>
            </div>
            <div class="setting-option sf-scope-row">
              <span class="sf-scope-row__label">Channel</span>
              <span class="custom-toggle">
                <input
                  type="checkbox"
                  checked
                  value="channel"
                  class="settings-toggle toggle-hidden"
                  id="channel-toggle"
                />
                <label class="toggle-label" for="channel-toggle"></label>
              </span>
            </div>
            <div class="setting-option sf-scope-row">
              <span class="sf-scope-row__label">Subscriptions</span>
              <span class="custom-toggle">
                <input
                  type="checkbox"
                  checked
                  value="subscription"
                  class="settings-toggle toggle-hidden"
                  id="subscription-toggle"
                />
                <label class="toggle-label" for="subscription-toggle"></label>
              </span>
            </div>
          </div>
        </section>
      </main>
    </div>

    <section id="edit-keywords-list" class="sf-drawer" aria-hidden="true">
      <div class="sf-drawer__header">
        <h2 class="sf-drawer__title">Phrases</h2>
        <button
          type="button"
          class="sf-icon-btn sf-drawer__close"
          id="close-keyword-list"
          aria-label="Close"
        ></button>
      </div>
      <div class="keywords-list-section sf-drawer__body">
        <div id="keyword-list-empty" class="sf-empty" hidden>
          <p class="sf-empty__text">None saved yet.</p>
        </div>
        <ul id="keyword-list"></ul>
      </div>
    </section>
  </body>
</html>
